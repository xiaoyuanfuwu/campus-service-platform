<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>校园服务平台 · 内容审核台</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/logo-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/logo-64.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="stylesheet" href="styles.css?v=15">
<style>
  /* 覆盖 styles.css 的固定布局，让审核端可独立滚动
     styles.css 中 body 是 position:fixed + inset:0 + overflow:hidden，
     必须全部还原为 static/auto，否则页面永远锁死在视口无法滚动 */
  html, body {
    overflow: visible !important;
    height: auto !important;
    position: static !important;
    inset: auto !important;
    width: auto !important;
    max-width: none !important;
  }
</style>
<style>
  body { background: var(--bg, #f5f6fa); }
  /* ===== 独立审核端布局 ===== */
  .audit-topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 100;
    background: linear-gradient(135deg, #7C5CFF 0%, #5A9CFF 100%);
    color: #fff; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; box-shadow: 0 2px 12px rgba(0,0,0,.12);
  }
  .audit-topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
  .audit-topbar .brand .sub { font-size: 11px; opacity: .85; font-weight: 400; margin-left: 2px; }
  .audit-topbar .right { display: flex; align-items: center; gap: 14px; font-size: 13px; }
  .audit-topbar .right .uname { opacity: .95; }
  .audit-topbar .right .logout { cursor: pointer; background: rgba(255,255,255,.18); border-radius: 8px; padding: 5px 12px; font-size: 12px; transition: background .2s; }
  .audit-topbar .right .logout:hover { background: rgba(255,255,255,.3); }
  .audit-main { padding: 76px 20px 40px; max-width: 1280px; margin: 0 auto; }
  /* 统计卡片 */
  .stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .stat-card {
    background: #fff; border-radius: 14px; padding: 16px 18px; cursor: pointer;
    border: 2px solid transparent; transition: all .2s; box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  .stat-card.active { border-color: var(--acc, #7C5CFF); }
  .stat-card .num { font-size: 28px; font-weight: 800; line-height: 1.2; }
  .stat-card .lab { font-size: 12px; color: var(--t3, #999); margin-top: 2px; }
  .stat-card.c-pending .num { color: #E6A23C; }
  .stat-card.c-approved .num { color: #52C41A; }
  .stat-card.c-rejected .num { color: #F56C6C; }
  .stat-card.c-total .num { color: #7C5CFF; }
  /* 面板 */
  .audit-panel { background: #fff; border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.05); overflow: hidden; }
  .audit-tabs { display: flex; border-bottom: 1px solid var(--bd, #eee); padding: 0 14px; background: #fafbff; }
  .audit-tab { padding: 13px 18px; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--t2, #666); font-weight: 500; }
  .audit-tab:hover { color: var(--acc, #7C5CFF); }
  .audit-tab.active { color: var(--acc, #7C5CFF); border-bottom-color: var(--acc, #7C5CFF); font-weight: 700; }
  .audit-tab .cnt { font-size: 11px; background: rgba(124,92,255,.12); color: var(--acc, #7C5CFF); border-radius: 10px; padding: 1px 7px; margin-left: 5px; }
  .toolbar { padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .toolbar .search-group { display: flex; gap: 8px; flex: 1; min-width: 260px; }
  .toolbar input, .toolbar select { border: 1px solid var(--bd, #ddd); border-radius: 8px; padding: 7px 12px; font-size: 13px; background: #fff; outline: none; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--acc, #7C5CFF); }
  .toolbar input { flex: 1; }
  .toolbar .action-btn { background: var(--acc, #7C5CFF); color: #fff; border: none; border-radius: 8px; padding: 7px 16px; cursor: pointer; font-size: 13px; }
  .toolbar .action-btn:hover { opacity: .9; }
  .table-wrap { overflow-x: auto; }
  table.audit-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .audit-table th { background: #f8f9fc; text-align: left; padding: 10px 14px; color: var(--t3, #999); font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--bd, #eee); white-space: nowrap; }
  .audit-table td { padding: 10px 14px; border-bottom: 1px solid var(--bd, #f0f0f0); vertical-align: middle; }
  .audit-table tr:hover td { background: #fafbff; }
  .audit-table .ttl { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .audit-table .ops { white-space: nowrap; }
  .audit-table .ops .ab { border: none; border-radius: 7px; padding: 5px 11px; font-size: 12px; cursor: pointer; margin-right: 6px; }
  .ab.s { background: #E8F7E4; color: #389E0D; }
  .ab.s:hover { background: #d9f2d2; }
  .ab.d { background: #FDECEC; color: #D4380D; }
  .ab.d:hover { background: #fadcdc; }
  .ab.v { background: #EFF3FF; color: #2F54EB; }
  .ab.v:hover { background: #e3e9ff; }
  .audit-table .meta { font-size: 11px; color: var(--t3, #999); margin-top: 2px; }
  .pager { padding: 12px 14px; display: flex; justify-content: center; gap: 4px; }
  .pager button { border: 1px solid var(--bd, #ddd); background: #fff; border-radius: 7px; padding: 5px 11px; font-size: 12px; cursor: pointer; }
  .pager button.a { background: var(--acc, #7C5CFF); color: #fff; border-color: var(--acc, #7C5CFF); }
  .pager button:disabled { opacity: .4; cursor: default; }
  .pager .info { font-size: 12px; color: var(--t3, #999); align-self: center; margin-left: 6px; }
  .reason-inline { font-size: 11px; color: var(--t3, #999); margin-top: 2px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 登录 */
  #loginPage { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .audit-logo { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #7C5CFF, #5A9CFF); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 12px; box-shadow: 0 4px 14px rgba(124,92,255,.35); }
  @media (max-width: 720px) { .stat-cards { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage">
  <div class="login-box">
    <div class="audit-logo">审</div>
    <h1>内容审核台</h1>
    <div class="sub">校园服务平台 · 校园内容审核中心</div>
    <div class="login-input-wrap">
      <svg class="li-ic" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <input type="text" id="loginUser" placeholder="管理员账号" autocomplete="off">
    </div>
    <div class="login-input-wrap">
      <svg class="li-ic" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input type="password" id="loginPass" placeholder="管理员密码" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button onclick="doLogin()">登 录</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="appPage" style="display:none">
  <div class="audit-topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 64 64"><image href="assets/logo-64.png" x="0" y="0" width="64" height="64" preserveAspectRatio="xMidYMid meet"/></svg>
      校园服务平台 · 内容审核台 <span class="sub">审核通过后才公开展示</span>
    </div>
    <div class="right">
      <span class="uname" id="topUname">管理员</span>
      <span class="logout" onclick="doLogout()">退出登录</span>
    </div>
  </div>

  <div class="audit-main">
    <!-- 统计卡片 -->
    <div class="stat-cards" id="statCards"></div>

    <!-- 审核面板 -->
    <div class="audit-panel">
      <div class="audit-tabs" id="auditTabs"></div>
      <div class="toolbar">
        <div class="search-group">
          <input type="text" id="searchKW" placeholder="搜索标题 / 内容 / 联系方式..." onkeyup="if(event.key==='Enter')loadList(1)">
          <select id="filterAudit">
            <option value="">全部审核状态</option>
            <option value="pending">待审核</option>
            <option value="approved">已通过</option>
            <option value="rejected">已拒绝</option>
          </select>
          <select id="filterModule" style="display:none"></select>
          <button class="action-btn" onclick="loadList(1)">搜索</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="audit-table">
          <thead id="listHead"></thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
      <div class="pager" id="pager"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { api, setAuth, clearAuth, getAuth } from './api.js';
import { esc, fmt, emptyRow, renderPg } from './utils.js';

// ============ 全局 ============
window.api = api;
const MODULES = [
  { id:'carpool', label:'拼车出行', icon:'🚗' },
  { id:'express', label:'快递代取', icon:'📦' },
  { id:'task', label:'万能任务', icon:'🎯' },
  { id:'lost', label:'失物招领', icon:'🔍' },
  { id:'forum', label:'校园论坛', icon:'💬' },
  { id:'secondhand', label:'二手市集', icon:'🔄' },
  { id:'rental', label:'物品短租', icon:'🏠' },
  { id:'substitute', label:'代课', icon:'📚' },
  { id:'print', label:'打印跑腿', icon:'🖨️' },
  { id:'yellowpage', label:'校园黄页', icon:'📒' },
  { id:'charity', label:'爱心公益', icon:'❤️' },
  { id:'parttime', label:'兼职专区', icon:'💼' },
];
const TYPE_TABS = [
  { id: 'module', label: '模块帖子', icon: '📦' },
  { id: 'forum',  label: '校园墙',   icon: '💬' },
  { id: 'verify', label: '实名认证', icon: '🪪' },
];
let curType = 'module';
let curModule = '';
let curFilterAudit = '';
let curPage = 1;
const PAGE_SIZE = 50; // 每页最多 50 条，翻页时才请求下一页，避免一次性全量加载拖垮数据库

// ============ Toast / Modal ============
const toastEl = document.getElementById('toast');
function toast(msg, type) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show ' + (type || '');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2500);
}
window.toast = toast;
const modalOverlay = document.getElementById('modalOverlay');
const modalBox = document.getElementById('modalBox');
function showModal(title, body) {
  modalBox.innerHTML = `<div class="mh"><div class="ti">${title}</div><div class="mc" onclick="closeModal()">✕</div></div><div class="mbd">${body}</div>`;
  modalOverlay.classList.add('show');
}
function closeModal() { modalOverlay.classList.remove('show'); }
window.showModal = showModal;
window.closeModal = closeModal;
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

// ============ 登录 ============
window.doLogin = async function() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  const errEl = document.getElementById('loginErr');
  if (!u || !p) { errEl.textContent = '请输入账号和密码'; return; }
  errEl.textContent = '登录中...';
  const res = await api('POST', '/api/admin/login', { username: u, password: p });
  if (res.success && res.data && res.data.token) {
    setAuth(res.data.token);
    localStorage.setItem('admin_info', JSON.stringify(res.data.admin || {}));
    enterApp(res.data.admin || {});
  } else {
    errEl.textContent = res.message || '登录失败';
  }
};
window.doLogout = function() {
  if (confirm('确定要退出登录吗？')) { clearAuth(); location.reload(); }
};

function enterApp(admin) {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = 'block';
  const uname = admin.username || admin.nickName || 'Admin';
  const roleTxt = admin.role === 'moderator' ? '· 审核员' : (admin.role === 'super_admin' || admin.role === 'superadmin') ? '· 超管' : '· 管理员';
  document.getElementById('topUname').textContent = uname + ' ' + roleTxt;
  renderTabs();
  renderModuleSelect();
  loadList(1);
}

// ============ Tab 渲染 ============
function renderTabs() {
  document.getElementById('auditTabs').innerHTML = TYPE_TABS.map(t =>
    `<div class="audit-tab ${curType===t.id?'active':''}" onclick="switchType('${t.id}')">${t.icon} ${t.label}</div>`
  ).join('');
}
window.switchType = function(type) {
  curType = type; curPage = 1; curModule = '';
  document.getElementById('filterModule').value = '';
  renderTabs();
  renderModuleSelect();
  // 实名认证 tab：隐藏帖子搜索，显示认证筛选
  const kw = document.getElementById('searchKW');
  const fa = document.getElementById('filterAudit');
  if (type === 'verify') {
    kw.style.display = 'none';
    fa.innerHTML = '<option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已拒绝</option><option value="">全部</option>';
    fa.style.display = '';
    fa.value = curFilterAudit === '' ? 'pending' : curFilterAudit;
    curFilterAudit = fa.value;
    loadVerifyList(1);
    loadVerifyStats();
    return;
  }
  kw.style.display = '';
  fa.innerHTML = '<option value="">全部审核状态</option><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已拒绝</option>';
  fa.style.display = '';
  loadList(1);
  loadStats();
};

function renderModuleSelect() {
  const sel = document.getElementById('filterModule');
  if (curType === 'module') {
    sel.style.display = '';
    sel.innerHTML = '<option value="">全部模块</option>' + MODULES.map(m => `<option value="${m.id}">${m.icon} ${m.label}</option>`).join('');
  } else {
    sel.style.display = 'none';
  }
}
window.filterModuleChanged = function(v) { curModule = v; loadList(1); };
document.getElementById('filterModule').addEventListener('change', function() { curModule = this.value; loadList(1); });
document.getElementById('filterAudit').addEventListener('change', function() {
  curFilterAudit = this.value;
  if (curType === 'verify') loadVerifyList(1);
  else loadList(1);
});

// ============ 统计卡片 ============
async function loadStats() {
  const el = document.getElementById('statCards');
  try {
    const [m, f] = await Promise.all([
      api('GET', '/api/admin/modules?page=1&pageSize=1&auditStatus=pending'),
      api('GET', '/api/admin/forums?page=1&pageSize=1&auditStatus=pending'),
    ]);
    const mPending = m.data?.total || 0;
    const fPending = f.data?.total || 0;
    const pending = mPending + fPending; // modules 全量已含拼车，不重复统计

    // 已通过/已拒绝统计
    const [ma, mr, fa, fr] = await Promise.all([
      api('GET', '/api/admin/modules?page=1&pageSize=1&auditStatus=approved'),
      api('GET', '/api/admin/modules?page=1&pageSize=1&auditStatus=rejected'),
      api('GET', '/api/admin/forums?page=1&pageSize=1&auditStatus=approved'),
      api('GET', '/api/admin/forums?page=1&pageSize=1&auditStatus=rejected'),
    ]);
    const approved = (ma.data?.total||0) + (fa.data?.total||0);
    const rejected = (mr.data?.total||0) + (fr.data?.total||0);
    const total = pending + approved + rejected;

    const act = v => curFilterAudit === v ? ' active' : ''; // 高亮跟随当前筛选
    el.innerHTML = `
      <div class="stat-card c-pending${act('pending')}" onclick="quickFilter('pending')"><div class="num">${pending}</div><div class="lab">⏳ 待审核</div></div>
      <div class="stat-card c-approved${act('approved')}" onclick="quickFilter('approved')"><div class="num">${approved}</div><div class="lab">✅ 已通过</div></div>
      <div class="stat-card c-rejected${act('rejected')}" onclick="quickFilter('rejected')"><div class="num">${rejected}</div><div class="lab">❌ 已拒绝</div></div>
      <div class="stat-card c-total${act('')}" onclick="quickFilter('')"><div class="num">${total}</div><div class="lab">📊 全部内容</div></div>`;
  } catch (e) {
    el.innerHTML = '<div class="stat-card c-total"><div class="num">-</div><div class="lab">统计加载失败</div></div>';
  }
}
window.quickFilter = function(v) {
  curFilterAudit = v;
  document.getElementById('filterAudit').value = v;
  if (curType === 'verify') loadVerifyList(1);
  else loadList(1);
};

// ============ 列表加载 ============
// 注意：必须用具名函数！匿名函数赋给 window 属性时 name 为空，
// renderPg 用 fn.name 生成分页按钮 onclick，会导致生成 loadPage(2) 而点击无反应
window.loadList = async function loadList(page) {
  curPage = page || 1;
  // 实名认证 tab 走独立列表
  if (curType === 'verify') { loadVerifyList(curPage); return; }
  const kw = document.getElementById('searchKW').value.trim();
  const audit = document.getElementById('filterAudit').value;
  curFilterAudit = audit;

  let url, headCols;
  if (curType === 'forum') {
    url = `/api/admin/forums?page=${curPage}&pageSize=${PAGE_SIZE}`;
    headCols = ['标题', '板块', '发布者', '审核', '状态', '发布时间', '操作'];
  } else {
    url = `/api/admin/modules?page=${curPage}&pageSize=${PAGE_SIZE}`;
    if (curModule) url += '&module=' + curModule;
    headCols = ['标题', '模块', '发布者', '审核', '状态', '发布时间', '操作'];
  }
  if (kw) url += '&keyword=' + encodeURIComponent(kw);
  if (audit) url += '&auditStatus=' + audit;

  document.getElementById('listHead').innerHTML = '<tr>' + headCols.map(h => `<th>${h}</th>`).join('') + '</tr>';

  const res = await api('GET', url);
  const d = res.data || {};
  const list = d.list || [];

  document.getElementById('listBody').innerHTML = list.map(item => {
    if (curType === 'forum') return renderForumRow(item);
    return renderModuleRow(item);
  }).join('') || emptyRow(7);

  renderPg('pager', d.totalPages || 1, curPage, loadList);
  // 仅首页刷新统计（筛选/搜索/切 tab 都会回到第 1 页），翻页不再重复 COUNT 查询
  if (curPage === 1) loadStats();
};

function auditBadge(auditStatus, reason) {
  const map = {
    pending: '<span class="bs pending">待审核</span>',
    approved: '<span class="bs approved">已通过</span>',
    rejected: '<span class="bs rejected">已拒绝</span>',
  };
  const badge = map[auditStatus] || `<span class="bs">${esc(auditStatus||'-')}</span>`;
  const reasonHtml = reason ? `<div class="reason-inline">原因：${esc(reason)}</div>` : '';
  return badge + reasonHtml;
}
function statusBadge(status) {
  const map = { active:'活跃', completed:'已完成', cancelled:'已下架', closed:'已关闭', ended:'已结束' };
  return `<span class="bs ${status||'active'}">${map[status] || esc(status||'-')}</span>`;
}

function renderModuleRow(p) {
  const mod = MODULES.find(m => m.id === p.module);
  const modLabel = mod ? mod.icon + ' ' + mod.label : p.module;
  const title = p.title || (p.content||'').substring(0,30) || '无标题';
  const auditSt = p.auditStatus || 'approved';
  let ops = '';
  if (auditSt === 'pending') {
    ops = `<button class="ab s" onclick="auditAction('${p.id}','approve')">通过</button><button class="ab d" onclick="auditAction('${p.id}','reject')">拒绝</button>`;
  } else if (auditSt === 'rejected') {
    ops = `<button class="ab s" onclick="auditAction('${p.id}','approve')">通过</button>`;
  }
  ops += `<button class="ab v" onclick="viewDetail('${p.id}')">详情</button>`;
  if (auditSt === 'approved') {
    ops += `<button class="ab d" onclick="takedownAction('${p.id}')">下架</button>`;
  }
  return `<tr>
    <td><div class="ttl">${esc(title)}</div><div class="meta">#${p.id}</div></td>
    <td><span class="tag">${modLabel}</span></td>
    <td>${esc(p.creator?.nickName||'-')}</td>
    <td>${auditBadge(auditSt, p.auditReason)}</td>
    <td>${statusBadge(p.status)}</td>
    <td>${fmt(p.createTime)}</td>
    <td class="ops">${ops}</td>
  </tr>`;
}

function renderForumRow(p) {
  const title = p.title || '无标题';
  const auditSt = p.auditStatus || 'approved';
  const cat = (p.tags && p.tags.length ? p.tags[0] : '') || '校园墙';
  let ops = '';
  if (auditSt === 'pending') {
    ops = `<button class="ab s" onclick="auditAction('${p.id}','approve')">通过</button><button class="ab d" onclick="auditAction('${p.id}','reject')">拒绝</button>`;
  } else if (auditSt === 'rejected') {
    ops = `<button class="ab s" onclick="auditAction('${p.id}','approve')">通过</button>`;
  }
  ops += `<button class="ab v" onclick="viewDetail('${p.id}')">详情</button>`;
  if (auditSt === 'approved') {
    ops += `<button class="ab d" onclick="takedownAction('${p.id}')">下架</button>`;
  }
  return `<tr>
    <td><div class="ttl">${esc(title)}</div><div class="meta">#${p.id}</div></td>
    <td><span class="tag">${esc(cat)}</span></td>
    <td>${esc(p.creator?.nickName||'-')}</td>
    <td>${auditBadge(auditSt, p.auditReason)}</td>
    <td>${statusBadge(p.status)}</td>
    <td>${fmt(p.createTime)}</td>
    <td class="ops">${ops}</td>
  </tr>`;
}

// ============ 审核 / 下架 / 详情 ============
window.auditAction = async function(id, action) {
  let reason = '';
  if (action === 'reject') {
    reason = prompt('请输入拒绝原因（会通知发布者）：');
    if (reason === null) return;
    if (!reason.trim()) reason = '不符合发布规范';
  } else {
    if (!confirm('确认通过该内容审核？')) return;
  }
  let url;
  if (curType === 'forum') url = `/api/admin/forums/${id}/audit`;
  else url = `/api/admin/modules/${id}/audit`; // 拼车已并入 module_posts，统一走模块帖审核
  const res = await api('PUT', url, { action, reason: reason.trim() });
  if (res.success) {
    toast(action === 'approve' ? '✅ 审核通过' : '❌ 已拒绝', 'success');
    loadList(curPage);
  } else {
    toast(res.message || '操作失败', 'error');
  }
};

window.takedownAction = async function(id) {
  const reason = prompt('请输入下架原因（会通知发布者）：');
  if (reason === null) return;
  let url;
  if (curType === 'forum') url = `/api/admin/forums/${id}/takedown`;
  else url = `/api/admin/modules/${id}/takedown`; // 拼车已并入 module_posts
  const res = await api('PUT', url, { reason: reason.trim() || '违反平台规则' });
  if (res.success) {
    toast('🛑 已下架', 'success');
    loadList(curPage);
  } else {
    toast(res.message || '操作失败', 'error');
  }
};

window.viewDetail = async function(id) {
  let url;
  if (curType === 'forum') url = `/api/admin/forums/${id}`;
  else url = `/api/admin/modules/${id}`; // 拼车已并入 module_posts，详情统一走模块帖接口
  const res = await api('GET', url);
  if (!res.success) { toast(res.message || '获取失败', 'error'); return; }
  const p = res.data || {};

  // 拼车已并入模块帖：按 p.module 判断，统一入口展示拼车特有字段
  let carpoolHtml = '';
  if (p.module === 'carpool') {
    const extra = p.extra || {};
    const from = typeof p.from === 'string' ? p.from : (p.from?.name || p.from?.city || extra.from || '-');
    const to = typeof p.to === 'string' ? p.to : (p.to?.name || p.to?.city || extra.to || '-');
    const joinedCount = (p.participants || []).filter(x => x.status === 'joined').length;
    const ppl = `${joinedCount}/${p.totalSeats || '?'}`;
    const participantList = (p.participants || []).map(x =>
      `<div class="dr"><span class="dl">参与者</span><span class="dv">${esc(x.nickName||'-')} (${esc(x.status||'joined')}) 联系方式: ${esc(x.phone||x.contact||'未提供')}</span></div>`
    ).join('');
    carpoolHtml = `
       <div class="dr"><span class="dl">路线</span><span class="dv">${esc(from)} → ${esc(to)}</span></div>
       <div class="dr"><span class="dl">类型</span><span class="dv">${p.type === 'offer' ? '有空位' : '找同行'}</span></div>
       <div class="dr"><span class="dl">出发时间</span><span class="dv">${fmt(p.departureTime || extra.departureTime)}</span></div>
       <div class="dr"><span class="dl">人数</span><span class="dv">${ppl}</span></div>
       <div class="dr"><span class="dl">剩余座位</span><span class="dv">${p.remainSeats ?? '-'}</span></div>
       ${participantList}`;
  }

  const imagesHtml = (p.images||[]).length
    ? `<div class="dr"><span class="dl">图片(${p.images.length})</span><span class="dv">${p.images.map(img => `<img src="${esc(img)}" style="max-width:120px;max-height:120px;border-radius:6px;margin:4px;border:1px solid var(--bd)">`).join('')}</span></div>`
    : '';
  const extraHtml = Object.keys(p.extra||{}).length
    ? `<div class="dr"><span class="dl">扩展信息</span><span class="dv" style="white-space:pre-wrap;font-size:12px;color:var(--t2)">${esc(JSON.stringify(p.extra, null, 2))}</span></div>`
    : '';

  showModal('📄 内容详情',
    `<div style="max-height:70vh;overflow-y:auto">
    <div class="dr"><span class="dl">标题</span><span class="dv">${esc(p.title || '无标题')}</span></div>
    <div class="dr"><span class="dl">内容</span><span class="dv" style="max-height:200px;overflow-y:auto;white-space:pre-wrap;background:var(--bg-i);padding:12px;border-radius:6px">${esc(p.content || '')}</span></div>
    <div class="dr"><span class="dl">审核状态</span><span class="dv">${auditBadge(p.auditStatus, p.auditReason)}</span></div>
    <div class="dr"><span class="dl">发布状态</span><span class="dv">${statusBadge(p.status)}</span></div>
    <div class="dr"><span class="dl">发布者</span><span class="dv">${esc(p.creator?.nickName || '-')} (${esc(p.creator?.school || '')})</span></div>
    <div class="dr"><span class="dl">联系方式</span><span class="dv">${esc(p.contact || '未提供')}</span></div>
    <div class="dr"><span class="dl">价格</span><span class="dv">${p.price !== undefined && p.price !== null ? '¥' + p.price : '未设置'}</span></div>
    <div class="dr"><span class="dl">浏览量</span><span class="dv">${p.viewCount || 0}</span></div>
    <div class="dr"><span class="dl">发布时间</span><span class="dv">${fmt(p.createTime)}</span></div>
    ${carpoolHtml}
    ${imagesHtml}
    ${extraHtml}
    <div style="margin-top:14px;text-align:right">
      ${p.auditStatus === 'pending' ? `<button class="ab s" onclick="auditAction('${p.id}','approve');closeModal()">通过</button><button class="ab d" onclick="auditAction('${p.id}','reject');closeModal()">拒绝</button>` : ''}
      <button class="ab v" onclick="closeModal()">关闭</button>
    </div>
    </div>`);
};

// ============ 实名认证审核 ============
const VERIFY_TYPE_LABEL = {
  student_card: '学生证',
  id_card: '身份证',
  xuexin: '学信网',
  yi_campus: '易校园',
  campus_card: '校园卡',
};

async function loadVerifyStats() {
  const el = document.getElementById('statCards');
  try {
    const res = await api('GET', '/api/admin/verifications/stats');
    const st = (res.success && res.data) ? res.data : { pending: 0, approved: 0, rejected: 0, total: 0 };
    const act = v => curFilterAudit === v ? ' active' : '';
    el.innerHTML = `
      <div class="stat-card c-pending${act('pending')}" onclick="quickFilter('pending')"><div class="num">${st.pending||0}</div><div class="lab">🪪 待审核</div></div>
      <div class="stat-card c-approved${act('approved')}" onclick="quickFilter('approved')"><div class="num">${st.approved||0}</div><div class="lab">✅ 已通过</div></div>
      <div class="stat-card c-rejected${act('rejected')}" onclick="quickFilter('rejected')"><div class="num">${st.rejected||0}</div><div class="lab">❌ 已拒绝</div></div>
      <div class="stat-card c-total${act('')}" onclick="quickFilter('')}"><div class="num">${st.total||0}</div><div class="lab">📊 全部认证</div></div>`;
  } catch (e) {
    el.innerHTML = '<div class="stat-card c-total"><div class="num">-</div><div class="lab">统计加载失败</div></div>';
  }
}

window.loadVerifyList = async function loadVerifyList(page) {
  curPage = page || 1;
  const audit = document.getElementById('filterAudit').value;
  curFilterAudit = audit;
  const headCols = ['用户', '昵称', 'ID', '类型', '材料图片', '审核', '提交时间', '操作'];
  document.getElementById('listHead').innerHTML = '<tr>' + headCols.map(h => `<th>${h}</th>`).join('') + '</tr>';
  const url = `/api/admin/verifications?page=${curPage}&pageSize=${PAGE_SIZE}${audit ? '&status=' + audit : ''}`;
  const res = await api('GET', url);
  const d = res.data || {};
  const list = d.list || [];
  document.getElementById('listBody').innerHTML = list.map(v => {
    const user = v.user || {};
    const av = user.avatarUrl ? `<img src="${esc(user.avatarUrl)}" style="width:28px;height:28px;border-radius:50%;object-fit:cover">` : `<span style="width:28px;height:28px;border-radius:50%;background:#eee;display:inline-flex;align-items:center;justify-content:center;font-size:12px">${esc((user.nickName||'?')[0])}</span>`;
    const stTxt = v.status === 'approved' ? '已通过' : v.status === 'rejected' ? '已拒绝' : '待审核';
    const stCls = v.status === 'approved' ? 'approved' : v.status === 'rejected' ? 'rejected' : 'pending';
    let ops = '';
    if (v.status === 'pending') {
      ops = `<button class="ab s" onclick="verifyAction('${v.id}','approve')">通过</button><button class="ab d" onclick="verifyAction('${v.id}','reject')">拒绝</button>`;
    } else if (v.status === 'approved') {
      ops = `<button class="ab d" onclick="verifyAction('${v.id}','revoke')">撤销</button>`;
    } else {
      ops = `<span style="color:#999;font-size:12px">${esc(v.reject_reason||'—')}</span>`;
    }
    return `<tr>
      <td>${av}</td>
      <td><b>${esc(user.nickName||'-')}</b></td>
      <td style="font-variant-numeric:tabular-nums">${esc(user.user_id_code||user.userCode||'-')}</td>
      <td>${VERIFY_TYPE_LABEL[v.verify_type]||esc(v.verify_type)}</td>
      <td><img src="${esc(v.image_url)}" style="width:52px;height:52px;object-fit:cover;border-radius:6px;cursor:pointer" onclick="window.open('${esc(v.image_url)}','_blank')"></td>
      <td><span class="bs ${stCls}">${stTxt}</span></td>
      <td>${fmt(v.create_time)}</td>
      <td class="ops">${ops}</td>
    </tr>`;
  }).join('') || emptyRow(8);
  renderPg('pager', d.totalPages || 1, curPage, loadVerifyList);
  if (curPage === 1) loadVerifyStats();
};

window.verifyAction = async function(id, action) {
  if (action === 'approve') {
    if (!confirm('确认通过该用户实名认证？')) return;
    const res = await api('POST', `/api/admin/verifications/${id}/approve`);
    if (res.success) { toast('✅ 已通过认证', 'success'); loadVerifyList(curPage); }
    else toast(res.message || '操作失败', 'error');
  } else if (action === 'reject') {
    const reason = prompt('请输入拒绝原因（会通知用户）：');
    if (reason === null) return;
    const res = await api('POST', `/api/admin/verifications/${id}/reject`, { reason: reason.trim() || '材料不符合要求' });
    if (res.success) { toast('❌ 已拒绝', 'success'); loadVerifyList(curPage); }
    else toast(res.message || '操作失败', 'error');
  } else if (action === 'revoke') {
    if (!confirm('确认撤销该用户认证？撤销后需重新提交。')) return;
    const res = await api('POST', `/api/admin/verifications/${id}/revoke`);
    if (res.success) { toast('🛑 已撤销认证', 'success'); loadVerifyList(curPage); }
    else toast(res.message || '操作失败', 'error');
  }
};

// ============ 初始化 ============
(function init() {
  const info = JSON.parse(localStorage.getItem('admin_info') || '{}');
  if (getAuth()) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('appPage').style.display = 'block';
    const uname = info.username || info.nickName || '管理员';
    const roleTxt = info.role === 'moderator' ? '· 审核员' : (info.role === 'super_admin' || info.role === 'superadmin') ? '· 超管' : '· 管理员';
    document.getElementById('topUname').textContent = uname + ' ' + roleTxt;
    renderTabs();
    renderModuleSelect();
    loadList(1);
  }
})();
</script>
